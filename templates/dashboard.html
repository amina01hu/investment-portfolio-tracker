<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Portfolio Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f5f7fa;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    .form-group {
      margin-bottom: 15px;
    }
    input, button {
      padding: 10px;
      width: 100%;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    table {
      width: 100%;
      margin-top: 30px;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: left;
    }
    th {
      background-color: #007bff;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Portfolio Dashboard</h1>

    <!-- Search Portfolio -->
    <form method="POST" action="/add">
      <div class="form-group">
        <input type="hidden" name="user_id" value="{{ user_id }}">
        <label for="search">Add Portfolio Name</label>
        <input type="text" id="search" name="portfolio_name" required placeholder="Enter keyword or title">
       <hr/>
        <label for="search">Add Portfolio Description</label>
        <input type="text" id="search" name="portfolio_desc" required placeholder="Enter keyword or title">
      </div>
      <button type="submit">Add</button>
    </form>
    <!-- Portfolio List -->
    <h3 style="margin-top: 40px;">Your Portfolio</h3>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Description</th>
        </tr>
      </thead>
      <tbody>
        {% for item in portfolio %}
        <tr>
          <td>{{ item.name }}</td>
          <td>{{ item.description }}</td>
        </tr>
        {% else %}
        <tr><td colspan="3">No items found.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>
